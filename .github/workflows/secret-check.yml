name: CI Secret Check

on:
  push:
    branches: [ main, master, 'chore/**' ]
  workflow_dispatch: {}

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      # NEXTAUTH_SECRET — warn only, CI has a built-in fallback value
      - name: Check NEXTAUTH_SECRET (warning only)
        env:
          SECRET_VALUE: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "⚠️  WARNING: NEXTAUTH_SECRET is not set in GitHub secrets."
            echo "   Integration tests will use a CI-only fallback — safe for testing."
            echo "   For production, ensure AUTH_SECRET is set in your Azure Container App."
          else
            echo "✅ NEXTAUTH_SECRET is set (length: ${#SECRET_VALUE})"
          fi

      # AUTH_SECRET — warn only, Azure Container App sets this directly
      - name: Check AUTH_SECRET (warning only)
        env:
          SECRET_VALUE: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "⚠️  WARNING: AUTH_SECRET not set as a GitHub secret."
            echo "   Ensure AUTH_SECRET is set in your Azure Container App environment variables."
          else
            echo "✅ AUTH_SECRET is set (length: ${#SECRET_VALUE})"
          fi

      # Azure credentials — REQUIRED for deployment to work
      - name: Check Azure deployment secrets (required)
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          MISSING=""
          [ -z "$CLIENT_ID" ]       && MISSING="$MISSING AZURE_CLIENT_ID"
          [ -z "$CLIENT_SECRET" ]   && MISSING="$MISSING AZURE_CLIENT_SECRET"
          [ -z "$TENANT_ID" ]       && MISSING="$MISSING AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION_ID" ] && MISSING="$MISSING AZURE_SUBSCRIPTION_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ ERROR: Missing required GitHub secrets:$MISSING" >&2
            echo "   Add these at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All Azure deployment secrets are set"

      # POSTGRES_DATABASE_URL — required for prisma migrate in deploy workflow
      - name: Check POSTGRES_DATABASE_URL (required for migrations)
        env:
          SECRET_VALUE: ${{ secrets.POSTGRES_DATABASE_URL }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ ERROR: POSTGRES_DATABASE_URL is not set in GitHub secrets." >&2
            echo "   This is required for 'prisma migrate deploy' in the deploy workflow."
            echo "   Add it at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ POSTGRES_DATABASE_URL is set"
