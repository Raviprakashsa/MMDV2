name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: mmd-recruit-india-rg
  CONTAINER_REGISTRY: mmdrecruitreg17
  CONTAINER_APP_NAME: mmd-recruit-crm
  LOCATION: centralindia

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Quality Gate (typecheck + lint)
  # ──────────────────────────────────────────────
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────
  # Job 2: Run Prisma Migrations against production PostgreSQL
  # This MUST run before deployment so the schema is ready.
  # ──────────────────────────────────────────────
  migrate-and-seed:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify POSTGRES_DATABASE_URL is set
        run: |
          if [ -z "$POSTGRES_DATABASE_URL" ]; then
            echo "❌ FATAL: POSTGRES_DATABASE_URL is not set in GitHub secrets."
            echo "   Go to: https://github.com/Raviprakashsa/MMDV2/settings/secrets/actions"
            echo "   Add secret: POSTGRES_DATABASE_URL = <your production connection string>"
            exit 1
          fi
          echo "✅ POSTGRES_DATABASE_URL is set (length: ${#POSTGRES_DATABASE_URL})"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations against production PostgreSQL
        run: |
          echo "🚀 Running prisma migrate deploy..."
          npx prisma migrate deploy
          echo "✅ Migrations complete"

      - name: Seed PostgreSQL admin user (idempotent upsert)
        run: |
          echo "🌱 Seeding PostgreSQL (idempotent — safe to run on every deploy)..."
          npm run db:seed:prisma
          echo "✅ Seed complete"

  # ──────────────────────────────────────────────
  # Job 3: Build & Deploy to Azure Container Apps
  # ──────────────────────────────────────────────
  deploy:
    needs: migrate-and-seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sanitize Azure Credentials to strip any copy-pasted whitespace
      - name: Sanitize Azure Credentials
        id: sanitize
        run: |
          CLIENT_ID=$(echo "${{ secrets.AZURE_CLIENT_ID }}" | tr -d '[:space:]')
          CLIENT_SECRET=$(echo "${{ secrets.AZURE_CLIENT_SECRET }}" | tr -d '[:space:]')
          TENANT_ID=$(echo "${{ secrets.AZURE_TENANT_ID }}" | tr -d '[:space:]')
          SUBSCRIPTION_ID=$(echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | tr -d '[:space:]')
          CREDS_JSON="{\"clientId\":\"$CLIENT_ID\",\"clientSecret\":\"$CLIENT_SECRET\",\"tenantId\":\"$TENANT_ID\",\"subscriptionId\":\"$SUBSCRIPTION_ID\"}"
          echo "::add-mask::$CREDS_JSON"
          echo "creds=$CREDS_JSON" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ steps.sanitize.outputs.creds }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.CONTAINER_REGISTRY }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

          # Tag as latest
          docker tag $IMAGE_URI "${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest"
          docker push "${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest"

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

      - name: Wait for revision to become healthy
        run: |
          echo "⏳ Waiting up to 120s for the new revision to become healthy..."
          for i in $(seq 1 24); do
            STATE=$(az containerapp show \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "unknown")
            echo "  [${i}/24] Running state: $STATE"
            if [ "$STATE" = "Running" ]; then
              echo "✅ Application is running!"
              break
            fi
            sleep 5
          done

      - name: Health check against live URL
        run: |
          URL="https://mmd-recruit-crm.blackbay-54673e45.centralindia.azurecontainerapps.io/api/health"
          echo "🔍 Probing: $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            echo "  [${i}/12] HTTP status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              break
            fi
            sleep 10
          done

      - name: Print Live App URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  ✅ DEPLOYMENT SUCCESSFUL                               ║"
          echo "║  🌐 URL: https://$URL"
          echo "╚══════════════════════════════════════════════════════════╝"
