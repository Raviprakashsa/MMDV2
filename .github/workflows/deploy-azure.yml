name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: mmd-recruit-india-rg
  CONTAINER_REGISTRY: mmdrecruitreg17
  CONTAINER_APP_NAME: mmd-recruit-crm
  LOCATION: centralindia

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Quality Gate (typecheck + lint)
  # ──────────────────────────────────────────────
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────
  # Job 2: Build & Deploy to Azure Container Apps
  # ──────────────────────────────────────────────
  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Log in to Azure using Service Principal Credentials
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.CONTAINER_REGISTRY }}

      # Build and push Docker image to ACR
      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          # Tag as latest
          docker tag $IMAGE_URI "${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest"
          docker push "${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest"

      # Install Container Apps extension on CI runner
      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      # Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

      # Print live URL
      - name: Show Live App URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  ✅ DEPLOYMENT SUCCESSFUL                               ║"
          echo "║  🌐 URL: https://$URL"
          echo "╚══════════════════════════════════════════════════════════╝"
