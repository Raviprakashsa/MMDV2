name: CI - Integration Tests

on:
  push:
    branches: [ main, master, '**/chore/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmd_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mongodb://localhost:27017/mmdss
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mmd_v2?schema=public
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-not-for-production-use' }}
      AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-not-for-production-use' }}
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB on port 27017..."
          for i in $(seq 1 30); do
            if nc -z localhost 27017 2>/dev/null; then
              echo "✅ MongoDB is ready"
              break
            fi
            echo "Attempt $i/30 — retrying in 2s..."
            sleep 2
          done

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL on port 5432..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Attempt $i/30 — retrying in 2s..."
            sleep 2
          done

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed PostgreSQL (creates admin@magnuscopo.com in PostgreSQL)
        run: npm run db:seed:prisma || true

      - name: Run MongoDB migrations
        run: |
          npm run migrate:status || true
          npm run migrate || true

      - name: Seed MongoDB (creates admin@magnuscopo.com in MongoDB)
        run: npm run db:seed || true

      - name: Build Next.js application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js (production mode)
        run: |
          nohup npm run start > server.log 2>&1 &
          echo "Waiting for /api/health to respond..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Application is healthy"
              exit 0
            fi
            echo "Health check attempt $i/30 failed — retrying in 4s..."
            sleep 4
          done
          echo "❌ Application failed to start after 120s. Last 200 lines of server.log:"
          tail -n 200 server.log || true
          exit 1

      - name: Run Playwright tests
        env:
          E2E_USE_SEEDED_USERS: '1'
          E2E_ADMIN_EMAIL: admin@magnuscopo.com
          E2E_ADMIN_PASSWORD: Admin123!
          E2E_SUPER_ADMIN_EMAIL: admin@magnuscopo.com
          E2E_SUPER_ADMIN_PASSWORD: Admin123!
        run: npx playwright test --reporter=list

      - name: Dump server.log on failure
        if: failure()
        run: |
          echo "========= server.log (last 500 lines) ========="
          tail -n 500 server.log || echo "(no server.log found)"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            server.log
            playwright-report/
            test-results/
