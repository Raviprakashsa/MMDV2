openapi: 3.1.0
info:
  title: A3 CRM API
  version: 1.0.0
  description: CRM API surface for Company, Contact, and Lead resources.
servers:
  - url: /api/v1
tags:
  - name: Company
  - name: Contact
  - name: Lead
components:
  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
    UserId:
      name: x-user-id
      in: header
      required: false
      schema:
        type: string
  schemas:
    Company:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        website: { type: string }
        industry: { type: string }
        phone: { type: string }
        email: { type: string }
      required: [id, tenantId, name, website, industry, phone, email]
    CompanyCreate:
      type: object
      properties:
        name: { type: string }
        website: { type: string }
        industry: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
      required: [name, website, industry, phone, email]
    CompanyUpdate:
      type: object
      properties:
        name: { type: string }
        website: { type: string }
        industry: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
    Contact:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        companyId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        title: { type: string }
      required: [id, tenantId, companyId, firstName, lastName, email, phone, title]
    ContactCreate:
      type: object
      properties:
        companyId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        title: { type: string }
      required: [companyId, firstName, lastName, email, phone, title]
    ContactUpdate:
      type: object
      properties:
        companyId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        title: { type: string }
    LeadStatus:
      type: string
      enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, WON, LOST]
    Lead:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        companyId: { type: [string, 'null'] }
        contactId: { type: [string, 'null'] }
        ownerId: { type: [string, 'null'] }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/LeadStatus' }
        value: { type: string }
      required: [id, tenantId, title, description, status, value]
    LeadCreate:
      type: object
      properties:
        companyId: { type: string }
        contactId: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/LeadStatus' }
        value:
          oneOf:
            - type: string
            - type: number
      required: [title, description, value]
    LeadUpdate:
      type: object
      properties:
        companyId: { type: string }
        contactId: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/LeadStatus' }
        value:
          oneOf:
            - type: string
            - type: number
    LeadStatusUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/LeadStatus' }
      required: [status]
paths:
  /companies:
    get:
      tags: [Company]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: name
          in: query
          schema: { type: string }
        - name: website
          in: query
          schema: { type: string }
        - name: industry
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Company list
    post:
      tags: [Company]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '200': { description: Created company }
  /companies/{id}:
    get:
      tags: [Company]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Company }
    patch:
      tags: [Company]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200': { description: Updated company }
    delete:
      tags: [Company]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deactivated company }
  /contacts:
    get:
      tags: [Contact]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: companyId
          in: query
          schema: { type: string }
        - name: firstName
          in: query
          schema: { type: string }
        - name: lastName
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
        - name: title
          in: query
          schema: { type: string }
      responses:
        '200': { description: Contact list }
    post:
      tags: [Contact]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200': { description: Created contact }
  /contacts/{id}:
    get:
      tags: [Contact]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Contact }
    patch:
      tags: [Contact]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200': { description: Updated contact }
    delete:
      tags: [Contact]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deactivated contact }
  /leads:
    get:
      tags: [Lead]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: companyId
          in: query
          schema: { type: string }
        - name: contactId
          in: query
          schema: { type: string }
        - name: ownerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: title
          in: query
          schema: { type: string }
      responses:
        '200': { description: Lead list }
    post:
      tags: [Lead]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '200': { description: Created lead }
  /leads/{id}:
    get:
      tags: [Lead]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lead }
    patch:
      tags: [Lead]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdate'
      responses:
        '200': { description: Updated lead }
  /leads/{id}/status:
    post:
      tags: [Lead]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadStatusUpdate'
      responses:
        '200': { description: Updated lead status }
